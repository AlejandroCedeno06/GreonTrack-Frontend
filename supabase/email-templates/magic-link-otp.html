<!--
  Pegar en: Dashboard de Supabase → Authentication → Email Templates → Magic Link
  {{ .Token }} es el código de 6 dígitos que la app pide con supabase.auth.verifyOtp().
  No quitar {{ .Token }} del cuerpo del correo o el login por código dejará de funcionar.
-->
<div style="background-color:#e8f5e9;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(15,61,46,0.12);">
    <tr>
      <td style="background:linear-gradient(135deg,#12483a,#0f3d2e 60%,#0a2e22);padding:28px 32px;text-align:center;">
        <span style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">GreenTrack</span>
      </td>
    </tr>
    <tr>
      <td style="padding:36px 32px 28px;text-align:center;">
        <h1 style="margin:0 0 12px;color:#0f3d2e;font-size:22px;">Tu código de acceso</h1>
        <p style="margin:0 0 24px;color:#52695f;font-size:15px;line-height:1.5;">
          Usa este código para terminar de iniciar sesión en GreenTrack. Es válido por un tiempo
          limitado y solo funciona una vez.
        </p>
        <div style="display:inline-block;background:#e8f5e9;border:1px solid #a7d7a0;border-radius:12px;padding:18px 32px;margin-bottom:24px;">
          <span style="font-size:32px;font-weight:800;letter-spacing:8px;color:#0f3d2e;font-family:'Courier New',monospace;">{{ .Token }}</span>
        </div>
        <p style="margin:0;color:#52695f;font-size:13px;">
          Si tú no intentaste iniciar sesión, puedes ignorar este correo con tranquilidad.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;background:#f4f9f4;text-align:center;">
        <span style="font-size:12px;color:#8aa79c;">GreenTrack — Análisis de consumo energético</span>
      </td>
    </tr>
  </table>
</div>
