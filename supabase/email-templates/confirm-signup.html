<!--
  Pegar en: Dashboard de Supabase → Authentication → Email Templates → Confirm signup
  {{ .ConfirmationURL }} es el link que activa la cuenta nueva — no quitarlo.
-->
<div style="background-color:#e8f5e9;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(15,61,46,0.12);">
    <tr>
      <td style="background:linear-gradient(135deg,#12483a,#0f3d2e 60%,#0a2e22);padding:28px 32px;text-align:center;">
        <span style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">GreenTrack</span>
      </td>
    </tr>
    <tr>
      <td style="padding:36px 32px 28px;text-align:center;">
        <h1 style="margin:0 0 12px;color:#0f3d2e;font-size:22px;">Confirma tu cuenta</h1>
        <p style="margin:0 0 28px;color:#52695f;font-size:15px;line-height:1.5;">
          Gracias por registrarte en GreenTrack. Confirma tu correo para empezar a monitorear tu
          consumo eléctrico, tu costo y tu huella de carbono.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background:linear-gradient(135deg,#66bb6a,#2e7d32 85%);color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;padding:14px 32px;border-radius:10px;">
          Confirmar mi correo
        </a>
        <p style="margin:28px 0 0;color:#8aa79c;font-size:13px;">
          Si tú no creaste esta cuenta, puedes ignorar este correo.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;background:#f4f9f4;text-align:center;">
        <span style="font-size:12px;color:#8aa79c;">GreenTrack — Análisis de consumo energético</span>
      </td>
    </tr>
  </table>
</div>
